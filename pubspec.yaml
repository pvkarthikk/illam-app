name: nm_flat
description: "Nest Mojo : Flat — run your home, together."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  collection: ^1.19.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  android_intent_plus: ^6.1.0
  wakelock_plus: ^1.8.2
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^23.0.3
  workmanager: ^0.10.10
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  pointycastle: ^4.0.0
  crypto: ^3.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  bonsoir: ^7.1.6
  connectivity_plus: ^7.3.2
  saf_util: ^3.1.1
  saf_stream: ^4.0.3
  archive: ^4.7.1
  dio: ^5.11.1
  dartssh2: ^4.1.0
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_appauth: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc   # SQLite3MultipleCiphers: encryption via PRAGMA key

flutter:
  uses-material-design: true
  generate: true
  default-flavor: dev
  assets:
    - assets/data/
    - assets/data/eff_short_wordlist.txt
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#D98F1C"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"
