name: Android build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build dev APK (debug)
        run: flutter build apk --debug --flavor dev

      - name: Build peer2 APK (debug)
        run: flutter build apk --debug --flavor peer2

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error

      - name: Upload peer2 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-peer2-debug
          path: build/app/outputs/flutter-apk/app-peer2-debug.apk
          if-no-files-found: error
