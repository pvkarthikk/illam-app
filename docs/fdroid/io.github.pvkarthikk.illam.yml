# fdroiddata recipe for Illam. Copy to metadata/io.github.pvkarthikk.illam.yml
# in your fork of https://gitlab.com/fdroid/fdroiddata and open a merge request.
Categories:
  - Money
  - System
License: Apache-2.0
AuthorName: pvkarthikk
WebSite: https://github.com/pvkarthikk/illam-app
SourceCode: https://github.com/pvkarthikk/illam-app
IssueTracker: https://github.com/pvkarthikk/illam-app/issues

AutoName: Illam

RepoType: git
Repo: https://github.com/pvkarthikk/illam-app.git

# Reproducible build: F-Droid ships the developer-signed GitHub release APK
# when the unsigned build matches it byte for byte.
Binaries: https://github.com/pvkarthikk/illam-app/releases/download/v%v/illam-v%v.apk
AllowedAPKSigningKeys: REPLACE_WITH_SHA256_OF_YOUR_RELEASE_SIGNING_CERT

Builds:
  - versionName: '1.3.1'
    versionCode: 1003001
    commit: v1.3.1
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/app/outputs/flutter-apk/app-dev-release.apk
    srclibs:
      - flutter@3.50.1
    rm:
      - ios
      - linux
      - macos
      - windows
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor dev --build-name=$$VERSION$$ --build-number=$$VERCODE$$
    scandelete:
      - .pub-cache

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: '1.3.1'
CurrentVersionCode: 1003001
